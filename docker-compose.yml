services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moto-scraper
    restart: unless-stopped
    command: python scraper.py
    env_file: .env
    environment:
      - TZ=Europe/Tallinn
      - CONFIG_PATH=/config/sources.yaml
      - DB_PATH=/data/articles.db
    volumes:
      - article_data:/data
      - ./sources.yaml:/config/sources.yaml:ro
    networks:
      - backend
    # Hardening: Prevent container from gaining new privileges
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moto-api
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 6060
    env_file: .env
    environment:
      - TZ=Europe/Tallinn
      - DB_PATH=/data/articles.db
    volumes:
      - article_data:/data
    expose:
      - "6060"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6060/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: moto-frontend
    restart: unless-stopped
    # This command injects 'server_tokens off' into the default config before starting Nginx
    command: >
      sh -c "sed -i 's/http {/http {\n    server_tokens off;/' /etc/nginx/nginx.conf 2>/dev/null || 
             sed -i '/server {/a \    server_tokens off;' /etc/nginx/conf.d/default.conf && 
             nginx -g 'daemon off;'"
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend_net
      - backend
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.7-alpine
    container_name: countersteer-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - umami
    networks:
      - frontend_net
    security_opt:
      - no-new-privileges:true

  umami_db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umamipassword}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - umami_net
    security_opt:
      - no-new-privileges:true

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umamipassword}@umami_db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      umami_db:
        condition: service_healthy
    networks:
      - frontend_net
      - umami_net
    security_opt:
      - no-new-privileges:true

networks:
  # Caddy and the Web entrypoints
  frontend_net:
  # API, Scraper, and App Logic
  backend:
  # Isolated database network
  umami_net:

volumes:
  article_data:
  caddy_data:
  caddy_config:
  umami_db_data:
